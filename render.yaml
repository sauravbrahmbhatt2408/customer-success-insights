services:
  - type: web
    name: csi-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Demo deployment: also load the admin and demo data (skipped if it already exists).
    dockerCommand: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: csi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: csi-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@csinsights.io
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: csi-redis
    plan: free
    ipAllowList: []

databases:
  - name: csi-db
    plan: free
    postgresMajorVersion: "16"
